version: "3.8"

services:
  langflow:
    image: langflowai/langflow:1.0-alpha
    ports:
      - "7860:7860"
    # depends_on:
    #   - postgres
    environment:
      # Configure your SingleStore connection string here
      # - LANGFLOW_DATABASE_URL=singlestoredb://user:password@host:3306/database
      # This variable defines where the logs, file storage, monitor data and secret keys are stored.
      - LANGFLOW_CONFIG_DIR=app/langflow
    volumes:
      - langflow-data:/app/langflow

  # SingleStore is typically run as a managed service, not in Docker Compose
  # Configure your LANGFLOW_DATABASE_URL above to connect to your SingleStore cluster

  # postgres:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_USER: langflow
  #     POSTGRES_PASSWORD: langflow
  #     POSTGRES_DB: langflow
  #   ports:
  #     - "5555:5555"
  #   volumes:
  #     - langflow-postgres:/var/lib/postgresql/data

volumes:
  # langflow-postgres:
  langflow-data:
